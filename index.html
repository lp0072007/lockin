<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LockIn">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>LockIn</title>
</head>
<body>
  <header id="top"></header>
  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="heute" class="active">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
      <span>Heute</span>
    </button>
    <button data-tab="essen">
      <svg viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 1.5-3 4-3 7h3v11"/></svg>
      <span>Essen</span>
    </button>
    <button data-tab="checkin">
      <svg viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>
      <span>Check-in</span>
    </button>
    <button data-tab="verlauf">
      <svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>
      <span>Verlauf</span>
    </button>
    <button data-tab="plan">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Plan</span>
    </button>
  </nav>

  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
