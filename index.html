<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LockIn">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>LockIn</title>
</head>
<body>
  <header id="top"></header>
  <main id="view"></main>

  <nav id="tabs">
    <button data-tab="gym">
      <svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>
      <span>Gym</span>
    </button>
    <button data-tab="food" class="active">
      <svg viewBox="0 0 24 24"><path d="M12 3.5c-3 4-5 6.8-5 9.5a5 5 0 0 0 10 0c0-2.7-2-5.5-5-9.5z"/></svg>
      <span>Essen &amp; Wasser</span>
    </button>
    <button data-tab="health">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span>Schlaf &amp; Health</span>
    </button>
  </nav>

  <div id="modal" hidden></div>
  <div id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
