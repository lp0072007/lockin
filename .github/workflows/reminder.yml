name: Abend-Erinnerung

# GitHub-Cron läuft in UTC. Beide Zeiten laufen, das Skript schickt nur bei 18 Uhr Wiener Zeit
# (Sommerzeit: 16 UTC, Winterzeit: 17 UTC).
on:
  schedule:
    - cron: '0 16 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node .github/scripts/notify.mjs
        env:
          VAPID_PUBLIC_KEY: BA3AhicVHF01V7yOJifku0ZUJeAd_jKqmHVefyppEU5-1CVzfbkvhKy5VBwHFMipGBnf3PprFHnjFMvA4gRPZVE
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SCHEDULE: ${{ github.event.schedule }}
